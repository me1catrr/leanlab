name: verificacion

# Reproduce en CI las evidencias de F01-P01 (PROOF, TEST, CROSS) y comprueba
# que los artefactos versionados coinciden con los que se regeneran.
# BENCH no se ejecuta en CI: las máquinas compartidas no sirven para medir.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f01:
    name: F01 · PROOF, TEST y CROSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PROOF · Lean 4 + Mathlib (caché) y lake build
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build-args: "LeanlabBook f01_tabla"

      - name: PROOF · Auditoría de axiomas (sin sorry)
        working-directory: lean
        run: |
          lake env lean LeanlabBook/F01/Auditoria.lean | tee axiomas.txt
          test "$(grep -c 'depends on axioms' axiomas.txt)" -eq 6
          ! grep -q 'sorryAx' axiomas.txt

      - name: PROOF · Oráculo ejecutable igual al versionado
        working-directory: lean
        run: |
          for t in 4x3 1x1 7x5 3x31; do
            lake exe f01_tabla "${t%x*}" "${t#*x}" > "../verification/F01/oraculo_lean/tabla_$t.json"
          done
          git diff --exit-code -- ../verification/F01/oraculo_lean

      - name: Instalar Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.3"

      - name: TEST · Julia
        run: |
          julia --project=julia -e 'using Pkg; Pkg.instantiate()'
          julia --project=julia julia/test/runtests.jl

      - name: CROSS · Tablas Julia iguales a las versionadas
        run: |
          julia --project=julia julia/scripts/exportar_tabla.jl
          git diff --exit-code -- verification/F01/julia

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6

      - name: CROSS · NumPy (pytest)
        run: uv run --project python pytest python/tests -v
