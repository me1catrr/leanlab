name: verificacion

# Reproduce en CI las evidencias de F01 y N01 (PROOF, TEST, CROSS) y comprueba
# que los artefactos versionados coinciden con los que se regeneran.
# BENCH no se ejecuta en CI: las máquinas compartidas no sirven para medir.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: F01, N01, N02 y N03 · PROOF, TEST y CROSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PROOF · Lean 4 + Mathlib (caché) y lake build
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build-args: "LeanlabBook f01_tabla n03_filtro"

      - name: PROOF · Auditoría de axiomas (sin sorry)
        working-directory: lean
        run: |
          lake env lean LeanlabBook/F01/Auditoria.lean | tee axiomas_f01.txt
          lake env lean LeanlabBook/N01/Auditoria.lean | tee axiomas_n01.txt
          lake env lean LeanlabBook/N02/Auditoria.lean | tee axiomas_n02.txt
          lake env lean LeanlabBook/N03/Auditoria.lean | tee axiomas_n03.txt
          test "$(grep -c 'depends on axioms' axiomas_n03.txt)" -eq 5
          test "$(grep -c 'depends on axioms' axiomas_f01.txt)" -eq 6
          test "$(grep -c 'depends on axioms' axiomas_n01.txt)" -eq 4
          test "$(grep -c 'depends on axioms' axiomas_n02.txt)" -eq 5
          ! grep -q 'sorryAx' axiomas_f01.txt axiomas_n01.txt axiomas_n02.txt axiomas_n03.txt

      - name: PROOF · Oráculo ejecutable igual al versionado
        working-directory: lean
        run: |
          for t in 4x3 1x1 7x5 3x31 4x2 4x4; do
            lake exe f01_tabla "${t%x*}" "${t#*x}" > "../verification/F01/oraculo_lean/tabla_$t.json"
          done
          git diff --exit-code -- ../verification/F01/oraculo_lean

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6

      - name: DATOS · Ficheros sintéticos de N01 y N02 (huellas)
        run: |
          uv run --project python python scripts/n01_ficheros.py
          (cd verification/N01/ficheros && shasum -a 256 -c ../ficheros.sha256)
          uv run --project python python scripts/n02_datos.py
          (cd verification/N02/datos && shasum -a 256 -c ../datos.sha256)
          uv run --project python python scripts/n03_senales.py
          # b1 depende de la libm (sin) y puede variar en el último bit entre sistemas:
          # se comprueban solo las entradas exactas.
          (cd verification/N03/senales && grep -v ' b1.f64$' ../senales.sha256 | shasum -a 256 -c -)
          git diff --exit-code -- verification/N01/esperado verification/N02/esperado

      - name: PROOF · Oráculo exacto de N03 igual al versionado
        working-directory: lean
        run: |
          lake exe n03_filtro < ../verification/N03/senales/a1_entrada.txt > ../verification/N03/oraculo_lean/a1.txt
          git diff --exit-code -- ../verification/N03/oraculo_lean

      - name: Instalar Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.3"

      - name: TEST · Julia
        run: |
          julia --project=julia -e 'using Pkg; Pkg.instantiate()'
          julia --project=julia julia/test/runtests.jl

      - name: CROSS · Lecturas Julia iguales a las versionadas
        run: |
          julia --project=julia julia/scripts/exportar_tabla.jl
          julia --project=julia julia/scripts/n01_exportar.jl
          julia --project=julia julia/scripts/n02_exportar.jl
          git diff --exit-code -- verification/F01/julia verification/N01/julia verification/N02/julia

      - name: CROSS · NumPy, SciPy y MNE-Python (pytest)
        run: |
          # N03 se recalcula en CI (sus valores en coma flotante pueden variar en el
          # último bit entre sistemas) y debe cumplir los criterios del protocolo.
          julia --project=julia julia/scripts/n03_exportar.jl
          uv run --project python python scripts/n03_cross.py
          uv run --project python pytest python/tests -v
          git checkout -- verification/N03

      - name: LABORATORIO · Componentes del libro iguales a los versionados
        run: |
          uv run --project python python scripts/laboratorio.py
          git diff --exit-code -- book/fundamentos book/aplicaciones book/assets/datos
