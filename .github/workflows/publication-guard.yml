name: publication-guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Guardián de publicación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archivos versionados e historial completo
        run: bash scripts/check-publication.sh --tracked --history

      # Se usa el binario oficial en lugar de gitleaks-action: la acción
      # escanea solo el rango del push (<primer commit>^..HEAD) y falla en el
      # primer push, cuyo commit raíz no tiene padre. Aquí se escanea siempre
      # todo el historial.
      - name: Gitleaks (secretos en todo el historial)
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
